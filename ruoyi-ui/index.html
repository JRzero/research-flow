<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html, body, #app {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      background: #f4f7fb;
    }
    #loader-wrapper {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #172033;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      transition: opacity .18s ease, visibility .18s ease;
    }
    .loader-card {
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
      border: 1px solid #dfe5ec;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(16,24,40,.07);
    }
    .loader-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 12px;
      background: linear-gradient(145deg,#2563eb,#0ea5e9);
      position: relative;
      overflow: hidden;
    }
    .loader-mark::before {
      content: "";
      position: absolute;
      inset: 11px;
      border: 3px solid rgba(255,255,255,.95);
      border-right-color: transparent;
      border-radius: 50%;
      animation: rf-spin .9s linear infinite;
    }
    .loader-copy strong {
      display: block;
      font-size: 14px;
      letter-spacing: .1px;
    }
    .loader-copy span {
      display: block;
      margin-top: 4px;
      color: #667085;
      font-size: 12px;
    }
    .loaded #loader-wrapper {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    @keyframes rf-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .loader-mark::before { animation: none; border-right-color: rgba(255,255,255,.95); }
      #loader-wrapper { transition: none; }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper" role="status" aria-live="polite">
      <div class="loader-card">
        <div class="loader-mark" aria-hidden="true"></div>
        <div class="loader-copy">
          <strong>ResearchFlow</strong>
          <span>正在加载科研项目工作空间</span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
