name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Maven tests
        run: mvn -B -ntp test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruoyi-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production bundle
        run: npm run build:prod

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config


  schema:
    name: MySQL schema smoke test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: research_flow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Load RuoYi schema
        run: mysql -h 127.0.0.1 -uroot -ppassword research_flow < sql/ry_20260417.sql
      - name: Load ResearchFlow V2 schema
        run: mysql -h 127.0.0.1 -uroot -ppassword research_flow < sql/z_research_flow.sql
      - name: Verify V2 core tables and seed
        run: |
          test "$(mysql -N -h 127.0.0.1 -uroot -ppassword research_flow -e "select count(*) from research_record")" -ge 3
          test "$(mysql -N -h 127.0.0.1 -uroot -ppassword research_flow -e "select count(*) from research_proposal")" -ge 3
          test "$(mysql -N -h 127.0.0.1 -uroot -ppassword research_flow -e "select count(*) from research_project")" -ge 2
          test "$(mysql -N -h 127.0.0.1 -uroot -ppassword research_flow -e "select count(*) from research_baseline")" -ge 2
